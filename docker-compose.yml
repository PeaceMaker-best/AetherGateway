name: aethergateway

services:
  postgres:
    # Starts only when using the internal database. When AETHERGATEWAY_DATABASE_URL
    # is set (an external PostgreSQL), this service moves to the "internal-db"
    # profile and is not started unless explicitly enabled with
    # `--profile internal-db`.
    profiles: ["${AETHERGATEWAY_DATABASE_URL:+internal-db}"]
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${AETHERGATEWAY_POSTGRES_DB:-aethergateway}
      POSTGRES_USER: ${AETHERGATEWAY_POSTGRES_USER:-aethergateway}
      POSTGRES_PASSWORD: ${AETHERGATEWAY_POSTGRES_PASSWORD:-}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - aethergateway-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: ${AETHERGATEWAY_POSTGRES_STOP_GRACE_PERIOD:-1m}
    logging:
      driver: json-file
      options:
        max-size: ${AETHERGATEWAY_LOG_MAX_SIZE:-10m}
        max-file: "${AETHERGATEWAY_LOG_MAX_FILES:-5}"

  aethergateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AETHERGATEWAY_VERSION: ${AETHERGATEWAY_VERSION:-0.1.3}
        AETHERGATEWAY_SOURCE_REVISION: ${AETHERGATEWAY_SOURCE_REVISION:-unknown}
        AETHERGATEWAY_SOURCE_STATE: ${AETHERGATEWAY_SOURCE_STATE:-unknown}
        AETHERGATEWAY_BUILD_DATE: ${AETHERGATEWAY_BUILD_DATE:-unknown}
    image: ${AETHERGATEWAY_IMAGE:-aethergateway:local}
    pull_policy: ${AETHERGATEWAY_PULL_POLICY:-never}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - ${AETHERGATEWAY_COMPOSE_ENV_FILE:-.env}
    environment:
      AETHERGATEWAY_BIND: 0.0.0.0:38082
      AETHERGATEWAY_ENV_FILE: /config/.env
      AETHERGATEWAY_STATE_DIR: /data
      AETHERGATEWAY_CONFIG: /config/config.toml
      AETHERGATEWAY_DATABASE_URL: ${AETHERGATEWAY_DATABASE_URL:-postgres://${AETHERGATEWAY_POSTGRES_USER:-aethergateway}:${AETHERGATEWAY_POSTGRES_PASSWORD:?set AETHERGATEWAY_POSTGRES_PASSWORD in .env}@postgres:5432/${AETHERGATEWAY_POSTGRES_DB:-aethergateway}}
      AETHERGATEWAY_TRUSTED_PROXIES: ${AETHERGATEWAY_TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      AETHERGATEWAY_ALLOWED_ORIGINS: ${AETHERGATEWAY_ALLOWED_ORIGINS:-}
      RUST_LOG: ${RUST_LOG:-model_port=info,tower_http=info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AETHERGATEWAY_API_PUBLISH:-127.0.0.1:38082}:38082"
    volumes:
      - aethergateway-data:/data
      - type: bind
        source: ${AETHERGATEWAY_COMPOSE_ENV_FILE:-./.env}
        target: /config/.env
        read_only: true
      # Optional file-based provider config:
      - ./config.toml:/config/config.toml:ro
    # The image-level healthcheck is liveness-only. Compose overrides it with
    # authenticated storage readiness so `healthy` means the gateway may take
    # traffic. Shared deployments should issue a dedicated scoped probe key.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          probe_key="$${AETHERGATEWAY_HEALTHCHECK_API_KEY:-$${AETHERGATEWAY_AUTH_TOKEN:-}}";
          test -n "$${probe_key}" &&
          curl -fsS -H "x-api-key: $${probe_key}" http://127.0.0.1:38082/readyz >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    # Default request timeout is 600s and finalizer drain is 30s. This window
    # lets an ordinary in-flight request finish before Docker sends SIGKILL.
    stop_grace_period: ${AETHERGATEWAY_STOP_GRACE_PERIOD:-11m}
    logging:
      driver: json-file
      options:
        max-size: ${AETHERGATEWAY_LOG_MAX_SIZE:-10m}
        max-file: "${AETHERGATEWAY_LOG_MAX_FILES:-5}"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        AETHERGATEWAY_VERSION: ${AETHERGATEWAY_VERSION:-0.1.3}
        AETHERGATEWAY_SOURCE_REVISION: ${AETHERGATEWAY_SOURCE_REVISION:-unknown}
        AETHERGATEWAY_SOURCE_STATE: ${AETHERGATEWAY_SOURCE_STATE:-unknown}
        AETHERGATEWAY_BUILD_DATE: ${AETHERGATEWAY_BUILD_DATE:-unknown}
    image: ${AETHERGATEWAY_DASHBOARD_IMAGE:-aethergateway-dashboard:local}
    pull_policy: ${AETHERGATEWAY_PULL_POLICY:-never}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "${AETHERGATEWAY_DASHBOARD_PUBLISH:-127.0.0.1:33002}:8080"
    restart: unless-stopped
    stop_grace_period: ${AETHERGATEWAY_DASHBOARD_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${AETHERGATEWAY_LOG_MAX_SIZE:-10m}
        max-file: "${AETHERGATEWAY_LOG_MAX_FILES:-5}"

  ops-agent:
    profiles: ["ops-agent"]
    build:
      context: .
      dockerfile: crates/ops-agent/Dockerfile
      args:
        AETHERGATEWAY_VERSION: ${AETHERGATEWAY_VERSION:-0.1.3}
        AETHERGATEWAY_SOURCE_REVISION: ${AETHERGATEWAY_SOURCE_REVISION:-unknown}
        AETHERGATEWAY_SOURCE_STATE: ${AETHERGATEWAY_SOURCE_STATE:-unknown}
        AETHERGATEWAY_BUILD_DATE: ${AETHERGATEWAY_BUILD_DATE:-unknown}
    image: ${AETHERGATEWAY_OPS_AGENT_IMAGE:-aethergateway-ops-agent:local}
    pull_policy: ${AETHERGATEWAY_PULL_POLICY:-never}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${AETHERGATEWAY_OPS_CPU_LIMIT:-0.50}
    mem_limit: ${AETHERGATEWAY_OPS_MEMORY_LIMIT:-256m}
    pids_limit: ${AETHERGATEWAY_OPS_PIDS_LIMIT:-128}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      AETHERGATEWAY_OPS_BASE_URL: http://aethergateway:38082
      AETHERGATEWAY_OPS_API_KEY: ${AETHERGATEWAY_OPS_API_KEY:-}
      AETHERGATEWAY_OPS_MODEL_API_KEY: ${AETHERGATEWAY_OPS_MODEL_API_KEY:-}
      AETHERGATEWAY_OPS_MODE: ${AETHERGATEWAY_OPS_MODE:-shadow}
      AETHERGATEWAY_OPS_INTERVAL_SECONDS: ${AETHERGATEWAY_OPS_INTERVAL_SECONDS:-300}
      AETHERGATEWAY_OPS_WEBHOOK_URL: ${AETHERGATEWAY_OPS_WEBHOOK_URL:-}
      RUST_LOG: ${AETHERGATEWAY_OPS_RUST_LOG:-aethergateway_ops_agent=info}
    volumes:
      - aethergateway-ops-spool:/var/lib/aethergateway-ops
    depends_on:
      aethergateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:38083/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${AETHERGATEWAY_LOG_MAX_SIZE:-10m}
        max-file: "${AETHERGATEWAY_LOG_MAX_FILES:-5}"

volumes:
  aethergateway-data:
  aethergateway-postgres-18:
  aethergateway-ops-spool:

networks:
  default:
    name: ${AETHERGATEWAY_NETWORK_NAME:-aethergateway_default}
    external: true
