name: aethergateway-production

# Phase-one production profile: one AetherGateway instance, an external managed
# PostgreSQL database, and secret-manager-rendered runtime environment. This
# file deliberately has no PostgreSQL service and no repository .env mount.
services:
  aethergateway:
    image: ${AETHERGATEWAY_IMAGE:?set a digest-pinned AetherGateway image}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    env_file:
      - path: ${AETHERGATEWAY_RUNTIME_ENV_FILE:?set a secret-manager-rendered runtime env file}
        required: true
    environment:
      AETHERGATEWAY_BIND: 0.0.0.0:38082
      AETHERGATEWAY_CONFIG: /config/config.toml
      AETHERGATEWAY_ENV_FILE: /run/aethergateway/no-repository-env
      AETHERGATEWAY_STATE_DIR: /data
      AETHERGATEWAY_ENTERPRISE_MODE: "1"
      AETHERGATEWAY_DATABASE_TLS_MODE: verify-full
      AETHERGATEWAY_REQUIRE_CONTROL_API_KEYS: "1"
      AETHERGATEWAY_ADMIN_COOKIE_SECURE: "1"
      AETHERGATEWAY_LOCAL_EXECUTING_PER_USER: "1"
      AETHERGATEWAY_LOCAL_QUEUED_PER_USER: "2"
      AETHERGATEWAY_LOCAL_QUEUE_GLOBAL: "16"
      AETHERGATEWAY_BATCH_QUEUE_GLOBAL: "16"
      AETHERGATEWAY_LOCAL_OVERFLOW_AFTER_SECONDS: "5"
      AETHERGATEWAY_LOCAL_STRICT_WAIT_SECONDS: "60"
      AETHERGATEWAY_FINALIZATION_DRAIN_TIMEOUT_SECONDS: "30"
      AETHERGATEWAY_REQUEST_DETAIL_RETENTION_DAYS: "30"
      AETHERGATEWAY_USER_USAGE_RETENTION_DAYS: "90"
      AETHERGATEWAY_AUDIT_RETENTION_DAYS: "395"
      AETHERGATEWAY_RETENTION_LEGAL_HOLD: ${AETHERGATEWAY_RETENTION_LEGAL_HOLD:-0}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${AETHERGATEWAY_API_PUBLISH:-127.0.0.1:38082}:38082
    volumes:
      - aethergateway-data:/data
      - type: bind
        source: ${AETHERGATEWAY_CONFIG_FILE:?set the reviewed non-secret config.toml path}
        target: /config/config.toml
        read_only: true
      - type: bind
        source: ${AETHERGATEWAY_DATABASE_CA_FILE:?set the managed PostgreSQL CA file}
        target: /run/aethergateway/database-ca.pem
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          probe_key="$${AETHERGATEWAY_HEALTHCHECK_API_KEY:-}";
          test -n "$${probe_key}" &&
          curl -fsS -H "x-api-key: $${probe_key}" http://127.0.0.1:38082/readyz >/dev/null
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    restart: unless-stopped
    stop_grace_period: ${AETHERGATEWAY_STOP_GRACE_PERIOD:-11m}
    logging:
      driver: json-file
      options:
        max-size: ${AETHERGATEWAY_LOG_MAX_SIZE:-10m}
        max-file: "${AETHERGATEWAY_LOG_MAX_FILES:-5}"

  dashboard:
    image: ${AETHERGATEWAY_DASHBOARD_IMAGE:?set a digest-pinned dashboard image}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - ${AETHERGATEWAY_DASHBOARD_PUBLISH:-127.0.0.1:33002}:8080
    restart: unless-stopped
    stop_grace_period: ${AETHERGATEWAY_DASHBOARD_STOP_GRACE_PERIOD:-30s}
    logging:
      driver: json-file
      options:
        max-size: ${AETHERGATEWAY_LOG_MAX_SIZE:-10m}
        max-file: "${AETHERGATEWAY_LOG_MAX_FILES:-5}"

volumes:
  aethergateway-data:

networks:
  default:
    name: ${AETHERGATEWAY_NETWORK_NAME:-aethergateway_default}
    external: true
